name: Build & Release Updated Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Auto-increment App Version & Build Number
        run: node scripts/auto_increment_version.js

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3584m -XX:MaxMetaspaceSize=1024m'"
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build_log.txt || {
            echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Rename Release APK
        run: |
          mkdir -p build/release-output
          cp build/app/outputs/flutter-apk/app-release.apk build/release-output/buoy-erp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buoy-erp-release-apk
          path: build/release-output/buoy-erp.apk
          if-no-files-found: error

      - name: Publish / Update 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Buoy ERP Latest Production Release"
          body: |
            ## Buoy ERP Android Release APK
            - **Build Trigger**: Automatic CI/CD Pipeline
            - **Commit**: ${{ github.sha }}
            - **Updated**: ${{ github.event.head_commit.timestamp || 'Latest' }}

            Download the updated APK below:
            - [**buoy-erp.apk**](https://github.com/${{ github.repository }}/releases/latest/download/buoy-erp.apk)
          draft: false
          prerelease: false
          files: build/release-output/buoy-erp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

